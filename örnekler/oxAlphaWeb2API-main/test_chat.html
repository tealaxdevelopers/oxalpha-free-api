<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OxAlpha Gateway — Chat Tester</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #1a1d27;
      --card-border: #2a2e3d;
      --text-main: #f0f3f6;
      --text-muted: #8b949e;
      --primary: #7c3aed;
      --primary-hover: #6d28d9;
      --accent: #10b981;
      --danger: #ef4444;
      --user-bubble: #2d3748;
      --bot-bubble: #1e2230;
      --code-bg: #13151f;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      background-color: var(--card-border);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover {
      background-color: #373e4f;
    }

    button.primary {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    button.primary:hover {
      background-color: var(--primary-hover);
    }

    button.danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }

    button.danger:hover {
      background-color: rgba(239, 68, 68, 0.25);
    }

    /* Settings Bar */
    .settings-bar {
      background: #141721;
      border-bottom: 1px solid var(--card-border);
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
      align-items: center;
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .setting-group label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .setting-group input, .setting-group select {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.82rem;
      outline: none;
    }

    .setting-group input:focus, .setting-group select:focus {
      border-color: var(--primary);
    }

    /* Chat Area */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-items: flex-end;
    }

    .message.assistant {
      align-items: flex-start;
    }

    .bubble-wrapper {
      position: relative;
      max-width: 85%;
    }

    .role-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 0.95rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background-color: var(--primary);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .message.assistant .bubble {
      background-color: var(--bot-bubble);
      border: 1px solid var(--card-border);
      border-bottom-left-radius: 2px;
    }

    .cursor {
      display: inline-block;
      width: 6px;
      height: 14px;
      background-color: var(--primary);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.1%, 100% { opacity: 0; }
    }

    /* Footer Input Area */
    footer {
      background-color: var(--card-bg);
      border-top: 1px solid var(--card-border);
      padding: 16px 20px;
      flex-shrink: 0;
    }

    .input-box {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background-color: var(--bg-color);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      height: 52px;
      max-height: 160px;
      outline: none;
      line-height: 1.4;
      transition: border-color 0.15s;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .meta-info {
      max-width: 820px;
      margin: 6px auto 0 auto;
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Empty state */
    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      max-width: 420px;
    }
    .empty-state h3 {
      color: var(--text-main);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>⚡ OxAlpha Gateway</span>
      <span class="status-badge" id="status-badge">Ready</span>
    </div>
    <div class="header-actions">
      <button id="btn-clear" title="Clear conversation history">Clear Chat</button>
      <button id="btn-toggle-settings">Settings</button>
    </div>
  </header>

  <!-- Config / Settings Bar -->
  <div class="settings-bar" id="settings-bar">
    <div class="setting-group">
      <label for="cfg-endpoint">Endpoint:</label>
      <input type="text" id="cfg-endpoint" value="http://127.0.0.1:8000/v1" style="width: 210px;">
    </div>
    <div class="setting-group">
      <label for="cfg-model">Model:</label>
      <select id="cfg-model">
        <option value="oxalpha">oxalpha (default)</option>
        <option value="ox-alpha">ox-alpha</option>
        <option value="z-ai/glm-5.3-flash">z-ai/glm-5.3-flash</option>
      </select>
    </div>
    <div class="setting-group">
      <label for="cfg-key">API Key:</label>
      <input type="password" id="cfg-key" placeholder="Optional" style="width: 110px;">
    </div>
    <div class="setting-group">
      <label><input type="checkbox" id="cfg-stream" checked> SSE Stream</label>
    </div>
    <div class="setting-group" style="flex: 1; min-width: 220px;">
      <label for="cfg-system">System Prompt:</label>
      <input type="text" id="cfg-system" placeholder="e.g. You are a helpful assistant" style="width: 100%;">
    </div>
  </div>

  <!-- Messages List -->
  <main id="chat-container">
    <div class="empty-state" id="empty-state">
      <h3>Ready to Chat</h3>
      <p>Send a message below to test streaming completions from the OxAlpha gateway proxy.</p>
    </div>
  </main>

  <!-- Input Form -->
  <footer>
    <form class="input-box" id="chat-form">
      <textarea
        id="user-input"
        placeholder="Type your message here... (Enter to send, Shift+Enter for new line)"
        rows="1"
        required
      ></textarea>
      <button type="submit" id="btn-send" class="primary" style="height: 52px; padding: 0 20px;">Send</button>
      <button type="button" id="btn-stop" class="danger" style="display: none; height: 52px; padding: 0 20px;">Stop</button>
    </form>
    <div class="meta-info">
      <span>Shift + Enter for new lines</span>
      <span id="token-usage"></span>
    </div>
  </footer>

  <script>
    // State
    const history = [];
    let currentAbortController = null;
    let isGenerating = false;

    // DOM Elements
    const chatContainer = document.getElementById("chat-container");
    const emptyState = document.getElementById("empty-state");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const btnSend = document.getElementById("btn-send");
    const btnStop = document.getElementById("btn-stop");
    const btnClear = document.getElementById("btn-clear");
    const statusBadge = document.getElementById("status-badge");
    const tokenUsage = document.getElementById("token-usage");

    // Config Elements
    const cfgEndpoint = document.getElementById("cfg-endpoint");
    const cfgModel = document.getElementById("cfg-model");
    const cfgKey = document.getElementById("cfg-key");
    const cfgStream = document.getElementById("cfg-stream");
    const cfgSystem = document.getElementById("cfg-system");
    const settingsBar = document.getElementById("settings-bar");
    const btnToggleSettings = document.getElementById("btn-toggle-settings");

    // Load saved settings
    if (localStorage.getItem("ox_endpoint")) cfgEndpoint.value = localStorage.getItem("ox_endpoint");
    if (localStorage.getItem("ox_model")) cfgModel.value = localStorage.getItem("ox_model");
    if (localStorage.getItem("ox_key")) cfgKey.value = localStorage.getItem("ox_key");
    if (localStorage.getItem("ox_stream") !== null) cfgStream.checked = localStorage.getItem("ox_stream") === "true";
    if (localStorage.getItem("ox_system")) cfgSystem.value = localStorage.getItem("ox_system");

    // Persist settings on change
    [cfgEndpoint, cfgModel, cfgKey, cfgStream, cfgSystem].forEach(el => {
      el.addEventListener("change", () => {
        localStorage.setItem("ox_endpoint", cfgEndpoint.value.trim());
        localStorage.setItem("ox_model", cfgModel.value);
        localStorage.setItem("ox_key", cfgKey.value.trim());
        localStorage.setItem("ox_stream", cfgStream.checked);
        localStorage.setItem("ox_system", cfgSystem.value.trim());
      });
    });

    btnToggleSettings.addEventListener("click", () => {
      settingsBar.style.display = settingsBar.style.display === "none" ? "flex" : "none";
    });

    // Auto-resize textarea
    userInput.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 160) + "px";
    });

    userInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event("submit"));
      }
    });

    btnClear.addEventListener("click", () => {
      if (isGenerating) stopGeneration();
      history.length = 0;
      chatContainer.innerHTML = "";
      chatContainer.appendChild(emptyState);
      emptyState.style.display = "block";
      tokenUsage.textContent = "";
    });

    btnStop.addEventListener("click", stopGeneration);

    function stopGeneration() {
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
      }
      setGeneratingState(false);
    }

    function setGeneratingState(generating) {
      isGenerating = generating;
      btnSend.style.display = generating ? "none" : "block";
      btnStop.style.display = generating ? "block" : "none";
      userInput.disabled = generating;
      statusBadge.textContent = generating ? "Generating..." : "Ready";
      statusBadge.style.color = generating ? "var(--primary)" : "var(--accent)";
      if (!generating) userInput.focus();
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function appendMessageElement(role, text) {
      emptyState.style.display = "none";

      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${role}`;

      const wrapper = document.createElement("div");
      wrapper.className = "bubble-wrapper";

      const roleLabel = document.createElement("div");
      roleLabel.className = "role-label";
      roleLabel.textContent = role === "user" ? "You" : (cfgModel.value || "OxAlpha");

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = escapeHtml(text);

      wrapper.appendChild(roleLabel);
      wrapper.appendChild(bubble);
      msgDiv.appendChild(wrapper);
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      return bubble;
    }

    // Submit handler
    chatForm.addEventListener("submit", async function(e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text || isGenerating) return;

      userInput.value = "";
      userInput.style.height = "52px";

      // Append User message
      appendMessageElement("user", text);
      history.push({ role: "user", content: text });

      setGeneratingState(true);
      tokenUsage.textContent = "";

      // Prepare payload
      const messagesPayload = [];
      const systemPrompt = cfgSystem.value.trim();
      if (systemPrompt) {
        messagesPayload.push({ role: "system", content: systemPrompt });
      }
      history.forEach(m => messagesPayload.push({ role: m.role, content: m.content }));

      const endpoint = cfgEndpoint.value.replace(/\/+$/, "");
      const isStream = cfgStream.checked;
      const apiKey = cfgKey.value.trim();

      const headers = { "Content-Type": "application/json" };
      if (apiKey) headers["Authorization"] = `Bearer ${apiKey}`;

      const bodyData = {
        model: cfgModel.value,
        messages: messagesPayload,
        stream: isStream
      };

      currentAbortController = new AbortController();

      // Assistant placeholder bubble
      const assistantBubble = appendMessageElement("assistant", "");
      const cursor = document.createElement("span");
      cursor.className = "cursor";
      assistantBubble.appendChild(cursor);

      let fullAssistantText = "";

      try {
        const response = await fetch(`${endpoint}/chat/completions`, {
          method: "POST",
          headers: headers,
          body: JSON.stringify(bodyData),
          signal: currentAbortController.signal
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({ error: { message: response.statusText } }));
          throw new Error(errData?.error?.message || `HTTP ${response.status}`);
        }

        if (isStream) {
          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop(); // Keep trailing incomplete fragment

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith("event:")) continue;

              if (trimmed === "data: [DONE]") {
                break;
              }

              if (trimmed.startsWith("data: ")) {
                try {
                  const parsed = JSON.parse(trimmed.slice(6));
                  const delta = parsed.choices?.[0]?.delta?.content || "";
                  if (delta) {
                    fullAssistantText += delta;
                    assistantBubble.innerHTML = escapeHtml(fullAssistantText);
                    assistantBubble.appendChild(cursor);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                  }
                  if (parsed.usage) {
                    tokenUsage.textContent = `Tokens: ${parsed.usage.prompt_tokens} in / ${parsed.usage.completion_tokens} out (${parsed.usage.total_tokens} total)`;
                  }
                } catch (err) {
                  // Ignore JSON parse errors for fragmented lines
                }
              }
            }
          }
        } else {
          // Non-streaming response
          const data = await response.json();
          fullAssistantText = data.choices?.[0]?.message?.content || "";
          assistantBubble.innerHTML = escapeHtml(fullAssistantText);
          if (data.usage) {
            tokenUsage.textContent = `Tokens: ${data.usage.prompt_tokens} in / ${data.usage.completion_tokens} out (${data.usage.total_tokens} total)`;
          }
        }

        // Commit to history
        history.push({ role: "assistant", content: fullAssistantText });

      } catch (err) {
        if (err.name === "AbortError") {
          fullAssistantText += " [Stream stopped by user]";
        } else {
          fullAssistantText += `\n⚠️ Error: ${err.message}`;
          assistantBubble.style.borderColor = "var(--danger)";
        }
        assistantBubble.innerHTML = escapeHtml(fullAssistantText);
      } finally {
        if (cursor.parentNode) cursor.remove();
        setGeneratingState(false);
        currentAbortController = null;
      }
    });
  </script>
</body>
</html>
