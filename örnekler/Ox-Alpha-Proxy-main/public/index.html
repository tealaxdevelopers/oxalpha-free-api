<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ox Alpha</title>
<meta http-equiv="refresh" content="0;url=/chat">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#0a0a0f;color:#e8e8ef;font-family:Inter,system-ui,sans-serif;height:100%}
body{height:100%;display:grid;place-items:center}
.loader{text-align:center}
.spinner{width:32px;height:32px;margin:0 auto 14px;border:3px solid rgba(255,255,255,.1);border-top-color:#6e56cf;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
p{font-size:14px;color:#9a9ab0}
a{color:#8b7cf7}
</style>
</head>
<body>
<div class="loader">
<div class="spinner"></div>
<p>Opening Ox Alpha chat… <a href="/chat">click here if not redirected</a></p>
</div>
<script>location.replace("/chat");</script>
</body>
</html>
